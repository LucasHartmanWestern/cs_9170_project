# Restart: missing pca5 seeds for k=3 capture24 grid on Lambda
# Missing: TRJ1000 seed_42, TRJ2000 seed_42, TRJ3000 seeds 1+42
# Runs seeds=[1,42] for all ratios; seed_1 for TRJ1000/TRJ2000 is a harmless duplicate
dataset_name: capture24
multiclass: false
da_pct: 0.015
dp_protected_col: sex
minority_id: 1
majority_id: 0
win_seconds: 1.0
step_seconds: 0.5
reward_mode: wgl
lambda_schedule:
- 1.0
- 1.0
use_pca: true
total_episodes: 5000
phase2_episodes: null
gen_both_classes: false
curriculum_learning: false
use_delta_actions: true
delta_scale: 0.1
delta_clip: 0.2
pca_clip: null
radius_clip: 3.0
total_data_size: 5000
reward_shaping:
  utility_guard_min_factor: 0.0
local_weights:
  use_dvrl_local: false
  dvrl_max_bce: 0.693
  w_anchor: 0.0
  w_hard: 0.0
  w_div: 0.0
ffnn:
  hidden_sizes:
  - 32
  - 16
  learning_rate: 0.001
  batch_size: 64
  epochs: 10
  optimizer: adam
reinforce:
  hidden_sizes:
  - 64
  - 64
  lr: 0.0003
  gamma: 1.0
  entropy_start: 0.02
  entropy_end: 0.005
  optimizer: adam
benchmarks:
  run_ctgan: false
  run_ctabgan: false
max_parallel: 2
global_sigmoid_k: 3
permutations:
  principals:
    variables:
    - epochs
    - pca_components
    - seed
    - ratio_trajectory
    epochs:
    - 10
    - 20
    - 30
    pca_components:
    - 5
    seed:
    - 1
    - 42
    ratio_trajectory:
    - 0.2
    - 0.4
    - 0.6
