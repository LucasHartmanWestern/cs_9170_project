# Restart: Huron k=10, ratio=0.2, epochs=20, PCA=15 — dropped workers
# Original r02_e20 (2026-05-12) silently dropped 4/9 workers (max_parallel=9 spawn issue).
# This spec covers: PCA=15 seeds 0,1,42 (3 runs)
# Also run census_k10_r02_e20_pca10_s42_restart.yaml for the remaining PCA=10 seed_42 run.
# Run on cuda:0 after the main chain (r02_e20->r02_e30->r04_e10->r04_e20) finishes.
dataset_name: census_income
multiclass: false
da_pct: 0.01433
dp_protected_col: sex
minority_id: 0
majority_id: 1
reward_mode: wgl
lambda_schedule:
- 1.0
- 1.0
use_pca: true
total_episodes: 5000
phase2_episodes: null
gen_both_classes: false
curriculum_learning: false
use_delta_actions: true
delta_scale: 0.1
delta_clip: 0.2
pca_clip: null
radius_clip: 3.0
total_data_size: 5000
reward_shaping:
  utility_guard_min_factor: 0.0
local_weights:
  use_dvrl_local: false
  dvrl_max_bce: 0.693
  w_anchor: 0.0
  w_hard: 0.0
  w_div: 0.0
ffnn:
  hidden_sizes:
  - 32
  - 16
  learning_rate: 0.001
  batch_size: 64
  epochs: 20
  optimizer: adam
reinforce:
  hidden_sizes:
  - 64
  - 64
  lr: 0.0003
  gamma: 1.0
  entropy_start: 0.02
  entropy_end: 0.005
  optimizer: adam
benchmarks:
  run_ctgan: false
  run_ctabgan: false
max_parallel: 4
global_sigmoid_k: 10
permutations:
  principals:
    variables:
    - epochs
    - pca_components
    - seed
    - ratio_trajectory
    epochs:
    - 20
    pca_components:
    - 15
    seed:
    - 0
    - 1
    - 42
    ratio_trajectory:
    - 0.2
output_dir: /storage_1/epigou_storage/FORGE/training_runs_k10
