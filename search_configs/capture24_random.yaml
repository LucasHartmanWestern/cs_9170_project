name: capture24_random
base: vanilla_config.json

# Best principal config from EXP-046 grid (k=5, ep=10, ratio=0.2, pca=15)
# Mean val-EO=0.022, mean test-EO=0.004 across folds 0-2 — beats all other configs by 3×
base_patches:
  dataset_name: capture24
  da_pct: 0.015
  minority_id: 1
  majority_id: 0
  dp_protected_col: sex
  win_seconds: 1.0
  step_seconds: 0.5
  total_episodes: 5000
  reward_mode: wgl
  n_folds: 5
  fold_rng_seed: 6
  kfold_val_frac: 0.4
  seeds: [42]
  global_sigmoid_k: 5                    # top-level — primary read location (see k-bug note)
  reward_shaping.global_sigmoid_k: 5    # keep in sync with top-level
  pca_components: 15
  ratio_trajectory: 0.2      # traj=1000, real=4000 (total_data_size=5000)
  total_data_size: 5000
  ffnn.epochs: 10

# Each random config is replicated for folds 0, 1, 2 (20 configs × 3 folds = 60 jobs)
fold_indices: [0, 1, 2]

random:
  n_samples: 20
  seed: 0
  params:
    ffnn.learning_rate:  {dist: log_uniform, low: 1.0e-4, high: 1.0e-2}
    reinforce.lr:        {dist: log_uniform, low: 1.0e-5, high: 1.0e-3}
    delta_scale:         {dist: uniform,     low: 0.05,   high: 0.30}
    ffnn.optimizer:      {dist: choice, values: [adam, adamw, sgd]}
    reinforce.optimizer: {dist: choice, values: [adam, adamw]}

slurm:
  account: def-mcapretz
  time: "10:00:00"
  mem: "3G"
  cpus: 2
  gpu: 1
