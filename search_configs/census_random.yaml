name: census_random
base: vanilla_config.json

# Apply best principal params from grid search before running this
base_patches:
  dataset_name: census_income
  da_pct: 0.01433
  minority_id: 0
  majority_id: 1
  seeds: [0, 1, 42]
  total_episodes: 5000
  reward_mode: wgl
  dp_protected_col: sex
  reward_shaping.global_sigmoid_k: 10   # EXP-021 best (k=10 outperforms k=3,5)
  pca_components: 10                    # EXP-021 best
  traj_length: 2000                     # EXP-021 best
  real_data_size: 3000                  # EXP-021 best
  ffnn.epochs: 30                       # EXP-021 best (ep=30 > ep=20)
random:
  n_samples: 20
  seed: 0
  params:
    ffnn.learning_rate:  {dist: log_uniform, low: 1.0e-4, high: 1.0e-2}
    reinforce.lr:        {dist: log_uniform, low: 1.0e-5, high: 1.0e-3}
    delta_scale:         {dist: uniform,     low: 0.05,   high: 0.30}
    ffnn.optimizer:      {dist: choice, values: [adam, adamw, sgd]}
    reinforce.optimizer: {dist: choice, values: [adam, adamw]}

slurm:
  account: def-mcapretz
  time: "17:00:00"
  mem: "3G"
  cpus: 2
  gpu: 1
